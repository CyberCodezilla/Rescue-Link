version: 1
frontend:
  phases:
    preBuild:
      commands:
        - cd ../..
        - npm ci
        - npm run build:packages
        - cd apps/survivor-web
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*