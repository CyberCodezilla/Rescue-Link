AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: RescueLink asynchronous emergency workflow using AWS Lambda and Step Functions

Globals:
  Function:
    Runtime: nodejs22.x
    Timeout: 30
    MemorySize: 512
    Environment:
      Variables:
        AWS_NODEJS_CONNECTION_REUSE_ENABLED: '1'
        DYNAMODB_TABLE_INCIDENTS: !Ref IncidentTableName
        SAGEMAKER_ENDPOINT_NAME: rescue-link-triage-endpoint
        SAGEMAKER_MAX_TOKENS: '300'
        SAGEMAKER_TIMEOUT_MS: '3500'
        SAGEMAKER_TEMPERATURE: '0.2'
        BEDROCK_MODEL_ID: us.anthropic.claude-haiku-4-5-20251001-v1:0
        BEDROCK_MAX_TOKENS: '300'
        BEDROCK_TIMEOUT_MS: '3500'
        BEDROCK_TEMPERATURE: '0.2'
        TRIAGE_CRITICAL_PEOPLE_THRESHOLD: '5'
        TRIAGE_HIGH_PEOPLE_THRESHOLD: '3'
        TRIAGE_CRITICAL_NEEDS: medical,boat
        TRIAGE_CRITICAL_CATEGORIES: fire
        TRIAGE_HIGH_NEEDS: clean_water,food
        TRIAGE_HIGH_CATEGORIES: landslide
        TRIAGE_HEURISTIC_CONFIDENCE: '0.92'
        NOTIFICATION_PRIORITY_GATE: critical,high
        SNS_TOPIC_ARN: !Ref EmergencyTopic
        SES_FROM_EMAIL: !Ref SesFromEmail
        SES_ALERT_RECIPIENT: !Ref SesAlertRecipient
        RESCUELINK_CALLBACK_URL: !Ref RescueLinkCallbackUrl
        LAMBDA_CALLBACK_SECRET: !Ref LambdaCallbackSecret

Parameters:
  IncidentTableName:
    Type: String
    Default: rescue-incidents
  SesFromEmail:
    Type: String
    Default: alerts@rescuelink.org
    Description: Verified SES sender email address
  SesAlertRecipient:
    Type: String
    Default: responders@rescuelink.org
    Description: Emergency responder recipient email address
  RescueLinkCallbackUrl:
    Type: String
    Default: ''
    Description: Public HTTPS URL ending in /api/workflows/triage on the RescueLink Express API.
  LambdaCallbackSecret:
    Type: String
    NoEcho: true
    Default: rescue-link-default-lambda-callback-secret-2026
    MinLength: 32
    Description: Random secret used to authenticate Step Functions callbacks
  SatelliteIotTopic:
    Type: String
    Default: rescuelink/satellite/+/uplink
    Description: MQTT topic filter used by satellite and LoRa gateway uplinks.

Resources:
  IncidentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref IncidentTableName
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: status
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: N
        - AttributeName: priority
          AttributeType: S
        - AttributeName: assignedTo
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      GlobalSecondaryIndexes:
        - IndexName: StatusCreatedAtIndex
          KeySchema:
            - AttributeName: status
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: PriorityCreatedAtIndex
          KeySchema:
            - AttributeName: priority
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: AssignedToCreatedAtIndex
          KeySchema:
            - AttributeName: assignedTo
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  EmergencyTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: rescuelink-emergency-alerts

  TriageFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: apps/lambda/
      Handler: dist/triage.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
              Resource: !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${IncidentTableName}
        - Statement:
            - Effect: Allow
              Action:
                - sagemaker:InvokeEndpoint
                - bedrock:InvokeModel
              Resource: '*'

  NotificationFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: apps/lambda/
      Handler: dist/notifications.handler
      Policies:
        - SNSPublishMessagePolicy:
            TopicName: rescuelink-emergency-alerts
        - Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
              Resource: '*'

  CallbackFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: apps/lambda/
      Handler: dist/callback.handler

  SatelliteIngestFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: apps/lambda/
      Handler: dist/satellite.handler
      Environment:
        Variables:
          STATE_MACHINE_ARN: !Ref RescueWorkflow
          SATELLITE_IOT_TOPIC: !Ref SatelliteIotTopic
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
              Resource: !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${IncidentTableName}
            - Effect: Allow
              Action:
                - states:StartExecution
              Resource: !Ref RescueWorkflow

  SatelliteUplinkRule:
    Type: AWS::IoT::TopicRule
    Properties:
      RuleName: rescuelink_satellite_uplink
      TopicRulePayload:
        RuleDisabled: false
        AwsIotSqlVersion: '2016-03-23'
        Sql: !Sub "SELECT * FROM '${SatelliteIotTopic}'"
        Actions:
          - Lambda:
              FunctionArn: !GetAtt SatelliteIngestFunction.Arn

  SatelliteUplinkRulePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref SatelliteIngestFunction
      Principal: iot.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:rule/rescuelink_satellite_uplink

  RescueWorkflow:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: rescuelink-emergency-workflow
      Definition:
        StartAt: AI Triage
        States:
          AI Triage:
            Type: Task
            Resource: '${TriageFunctionArn}'
            ResultPath: '$.triage'
            Next: Emergency Notifications
            Retry:
              - ErrorEquals: [States.ALL]
                IntervalSeconds: 2
                MaxAttempts: 2
                BackoffRate: 2
          Emergency Notifications:
            Type: Task
            Resource: '${NotificationFunctionArn}'
            Parameters:
              incident.$: '$.triage.incident'
            ResultPath: '$.notifications'
            Next: Publish SSE Update
            Retry:
              - ErrorEquals: [States.ALL]
                IntervalSeconds: 2
                MaxAttempts: 2
                BackoffRate: 2
          Publish SSE Update:
            Type: Task
            Resource: '${CallbackFunctionArn}'
            Parameters:
              incident.$: '$.triage.incident'
              snsSent.$: '$.notifications.snsSent'
              sesSent.$: '$.notifications.sesSent'
              triageSource.$: '$.triage.triageSource'
            ResultPath: '$.callback'
            Catch:
              - ErrorEquals: [States.ALL]
                ResultPath: '$.callbackError'
                Next: Workflow Complete
            Next: Workflow Complete
          Workflow Complete:
            Type: Succeed
      DefinitionSubstitutions:
        TriageFunctionArn: !GetAtt TriageFunction.Arn
        NotificationFunctionArn: !GetAtt NotificationFunction.Arn
        CallbackFunctionArn: !GetAtt CallbackFunction.Arn
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref TriageFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref NotificationFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref CallbackFunction

  RescueLinkUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub '${AWS::StackName}-user-pool'
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false

  RescueLinkUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub '${AWS::StackName}-user-pool-client'
      UserPoolId: !Ref RescueLinkUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_PASSWORD_AUTH

Outputs:
  StateMachineArn:
    Value: !Ref RescueWorkflow
  TriageFunctionArn:
    Value: !GetAtt TriageFunction.Arn
  NotificationFunctionArn:
    Value: !GetAtt NotificationFunction.Arn
  CallbackFunctionArn:
    Value: !GetAtt CallbackFunction.Arn
  SatelliteIngestFunctionArn:
    Value: !GetAtt SatelliteIngestFunction.Arn
  SatelliteUplinkRuleName:
    Value: rescuelink_satellite_uplink
  IncidentTableName:
    Value: !Ref IncidentTableName
  EmergencyTopicArn:
    Value: !Ref EmergencyTopic
  UserPoolId:
    Value: !Ref RescueLinkUserPool
  UserPoolClientId:
    Value: !Ref RescueLinkUserPoolClient

